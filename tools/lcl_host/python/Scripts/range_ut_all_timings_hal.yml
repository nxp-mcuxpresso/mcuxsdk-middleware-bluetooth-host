## HADM Testcase definition file
# YAML syntax using following keywords:
# name: string identifying the testcases
# cat: list of categories (string, comma-separated) that will trigger sets of criteria to be checked. Can be core, rtp, rtt.
#      All categories will be checked if not specified.
# params: parameters passed to record_range_measurement script

description: 'Channel Sounding full timing combinations'

testcases:

-
    id: 500
    name: RTT&RTP 150/145/145/20 1Mbps
    cat: core, rtt, rtt1, rtp
    params: --mainmode 2 --submode 1 --testmode -n 5 --dutconfig "param timings int 150 145 145" --dutconfig "param timings t_pm 20"

