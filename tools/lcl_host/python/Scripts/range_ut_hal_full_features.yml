    id: 10020
    name: RS32
    skip: n
    cat: core, rtt, rtt1, nadm_on
    params: --mainmode 1 --testmode -n 5 --dutconfig "param timings int 150 145" --dutconfig "param timings t_pm 20" --dutconfig "param rtt_type 3"
