## HADM Testcase definition file
# YAML syntax using following keywords:
# name: string identifying the testcases
# cat: list of categories (string, comma-separated) that will trigger sets of criteria to be checked. Can be core, rtp, rtt.
#      All categories will be checked if not specified.
# params: parameters passed to record_range_measurement script

description: 'Full HADM features HAL & drivers'

testcases:
## Mode 3
-
    id: 1001
    name: Mode 3 1Mbps 150/145/20
    skip: n
    cat: core, rtt, rtt1, rtp, nadm_off
    params: --mainmode 3 --testmode -n 5 --dutconfig "param timings int 150 145" --dutconfig "param timings t_pm 20"
-
    id: 1002
    name: Mainmode 2 Submode 3 150/80/20
    skip: n
    cat: core, rtt, rtt1, rtp, nadm_off
    params: --mainmode 2 --submode 3 --testmode -n 5 --dutconfig "param timings int 150 80" --dutconfig "param timings t_pm 20"
-
    id: 1003
    name: Mainmode 3 Submode 2 50/40/40
    skip: n
    cat: core, rtt, rtt1, rtp, nadm_off
    params: --mainmode 3 --submode 2 --testmode -n 5 --dutconfig "param timings int 50 40" --dutconfig "param timings t_pm 40"
-
    id: 1004
    name: Mode3 Channel rand 50/40/20
    skip: n
    cat: core, rtp, rtt, rtt1, nadm_off
    params: --mainmode 3 --testmode -n 5 --dutconfig "param timings int 50 40" --dutconfig "param timings t_pm 20" --dutconfig "param ch_list generate 0 77 rand"
-
    id: 1005
    name: Mode3 2Mbps 150/145/20
    skip: n
    cat: core, rtt, rtt2, rtp, nadm_off
    params: --mainmode 3 --testmode -n 5 --dutconfig "param timings int 150 145" --dutconfig "param timings t_pm 20" --dutconfig "param rtt_phy 1"
-
    id: 1006
    name: Mode3 N_AP=4 T_SW=4 150/145/20
    skip: n
    cat: core, rtp, rtt, rtt1, nadm_off
    params: --mainmode 3 --testmode -n 5 --dutconfig "param ant 7 255" --dutconfig "param tone_ext 4" --dutconfig "param timings t_sw 4" --dutconfig "param timings int 150 145" --dutconfig "param timings t_pm 20"
-
    id: 1007
    name: Mainmode 2 Submode 3 N_AP=4 T_SW=10 150/145/20
    skip: n
    cat: core, rtp, rtt, rtt1, nadm_off
    params: --mainmode 2 --submode 3 --testmode -n 5 --dutconfig "param ant 7 0" --dutconfig "param tone_ext 0" --dutconfig "param timings t_sw 10" --dutconfig "param timings int 150 145" --dutconfig "param timings t_pm 20"
-
    id: 1010
    name: CONN Mode 3
    cat: core, rtp, rtt, rtt1, nadm_off
    params: --mainmode 3 -n 5
-
    id: 1011
    name: CONN Mainmode 2 Submode 3
    skip: n
    cat: core, rtp, rtt, rtt1, nadm_off
    params: --mainmode 2 --submode 3 -n 5
-
    id: 1012
    name: CONN Mode3 N_AP=4 2Mbps
    skip: n
    cat: core, rtp, rtt, rtt2, nadm_off
    params: --mainmode 3 -n 5 --dutconfig "param ant 7 0" --dutconfig "param rtt_phy 1"
# Random sequences
