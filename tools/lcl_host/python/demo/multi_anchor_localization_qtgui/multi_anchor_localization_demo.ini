[general]
max_values = 10
activity_minimum = 0.9
activity_depth = 2

[csvfile]
enable = true

[ranging]
board = kw38
serial_port = COM3
init_brd = 13
timeout = 1.5
measurement_mode = 7
antinit = 1
antrefl = 1
autostart = False

[logfile]
verbose = True

[plot]
match_scaling = True
draw_car_enabled = False
minor_ticks = False
pt_interpol = 5

[location_estimator]
type = GMM
filename = config_gmm.json

[1D_filter]
filter = kalman
depth = 40
offset = -1.7
bounds_lower = 0.0
bounds_upper = 20.0
flt_hysteresis = 100.0
flt_window = 5
flt_warnings = True
flt_alpha = 1.2
flt_d_std = 1.0
flt_a_std = 1.0
